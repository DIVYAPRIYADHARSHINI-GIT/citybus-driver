[project]
name = "citybus-backend"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "websockets>=14,<18",
  "SQLAlchemy>=2.0.36,<3",
  "alembic>=1.14,<2",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
]
[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1", "psutil>=6,<8"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
